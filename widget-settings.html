<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17171d">
  <title>My Calendar 위젯 설정</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#17171d;color:#f7f5fb;display:grid;place-items:center;padding:20px}
    main{width:min(520px,100%);background:#26252d;border:1px solid #46434f;border-radius:22px;padding:24px;box-shadow:0 24px 80px #0008}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#8b7cff,#c276e8);font-size:24px}
    h1{font-size:22px;margin:0}.muted{color:#aaa5b4;font-size:14px;line-height:1.55}.status{background:#312f39;border:1px solid #4b4755;border-radius:14px;padding:14px;margin:18px 0}
    .styles{display:grid;gap:10px;margin:16px 0 18px}.choice{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #504c59;background:#302f37;color:#f7f5fb;border-radius:13px;padding:14px;text-align:left;font-size:15px;font-weight:700}.choice.active{border-color:#b682ef;background:linear-gradient(90deg,#60406f,#3b3446);box-shadow:0 0 0 1px #b682ef55}.preview{display:flex;align-items:center;gap:8px;min-width:112px}.line{width:4px;height:24px;background:#ffef75;border-radius:3px}.fill{padding:6px 9px;border-radius:7px;background:#ffef7526;color:#ffef75}.text{color:#ffef75}.apply-help{margin:0 2px 14px}
    button,a.button{appearance:none;border:0;border-radius:13px;padding:15px 18px;width:100%;font-size:16px;font-weight:800;text-align:center;text-decoration:none;display:block;cursor:pointer}.primary{background:linear-gradient(90deg,#7f91ff,#b36ce2);color:white}.secondary{background:#3b3944;color:#ddd8e5;margin-top:10px}.hidden{display:none!important}.error{color:#ff8d9c}.ok{color:#80e1aa}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="logo">M</div><div><h1>위젯 일정 표시</h1><div class="muted">웹 캘린더 설정을 Android 위젯에 적용합니다.</div></div></div>
    <div id="status" class="status muted">설정을 확인하고 있습니다…</div>
    <section id="settings" class="hidden">
      <div class="styles" role="radiogroup" aria-label="일정 표시 방식">
        <button class="choice" data-style="fill"><span class="preview fill">프로젝트 회의</span><span>배경색 채우기</span></button>
        <button class="choice" data-style="marker"><span class="preview"><i class="line"></i>프로젝트 회의</span><span>왼쪽 색상선</span></button>
        <button class="choice" data-style="text"><span class="preview text">프로젝트 회의</span><span>글씨에만 색상</span></button>
      </div>
      <p class="muted apply-help">위젯이 없으면 Android의 홈 화면 추가 확인창이 열립니다. 이미 있으면 바로 갱신됩니다.</p>
      <button id="apply" class="primary">설정 적용 및 위젯 추가</button>
    </section>
    <button id="login" class="primary hidden">Google 계정으로 로그인</button>
    <a class="button secondary" href="./android-install.html">Android 앱 설치 안내</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const statusEl=document.getElementById('status'), settingsEl=document.getElementById('settings'), loginEl=document.getElementById('login');
    const choices=[...document.querySelectorAll('.choice')]; let selected='marker', client, signedInUser=null, savedPayload={};
    const labels={fill:'배경색 채우기',marker:'왼쪽 색상선',text:'글씨에만 색상'};
    function select(style){selected=['fill','marker','text'].includes(style)?style:'marker';choices.forEach(b=>{const on=b.dataset.style===selected;b.classList.toggle('active',on);b.setAttribute('aria-checked',String(on))})}
    choices.forEach(b=>b.addEventListener('click',()=>select(b.dataset.style)));
    async function init(){
      try{
        const c=window.MY_CALENDAR_CONFIG||{}; if(!c.supabaseUrl||!c.supabaseAnonKey) throw new Error('Supabase 연결 설정이 없습니다.');
        client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        const {data:{session}}=await client.auth.getSession();
        if(!session){statusEl.textContent='웹 캘린더에서 사용한 Google 계정으로 로그인하면 저장된 표시 설정을 불러옵니다.';loginEl.classList.remove('hidden');return}
        const {data,error}=await client.from('user_settings').select('payload').eq('user_id',session.user.id).maybeSingle(); if(error) throw error;
        signedInUser=session.user;savedPayload=data?.payload||{};select(savedPayload.eventStyle||'marker'); statusEl.innerHTML=`불러온 웹 설정 · <strong class="ok">${labels[selected]}</strong>`;settingsEl.classList.remove('hidden');
      }catch(e){statusEl.innerHTML=`<span class="error">${e.message||'설정을 불러오지 못했습니다.'}</span>`}
    }
    loginEl.addEventListener('click',async()=>{const redirectTo=location.origin+location.pathname;await client.auth.signInWithOAuth({provider:'google',options:{redirectTo,scopes:'openid email profile'}})});
    document.getElementById('apply').addEventListener('click',async()=>{
      try{
        if(signedInUser){const payload={...savedPayload,eventStyle:selected};const {error}=await client.from('user_settings').upsert({user_id:signedInUser.id,payload,schema_version:1},{onConflict:'user_id'});if(error)throw error;savedPayload=payload}
        location.href=`mycalendar://widget-settings?eventStyle=${encodeURIComponent(selected)}`;
      }catch(e){statusEl.innerHTML=`<span class="error">${e.message||'설정을 저장하지 못했습니다.'}</span>`}
    });
    init();
  </script>
</body>
</html>
